name: Storefront Playwright QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run T-990 storefront checks (desktop & mobile)
        run: npx playwright test

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
